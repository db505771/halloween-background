<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orange and Black Halloween Background</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden;
    }
    body {
      background: #080706;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .halloween-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      background:
        /* Bright orange glow at the upper-left */
        radial-gradient(
          ellipse 90% 55% at 0% 0%,
          rgba(255, 111, 12, 0.88) 0%,
          rgba(220, 76, 8, 0.48) 38%,
          transparent 76%
        ),
        /* Orange glow along the upper-right */
        radial-gradient(
          ellipse 75% 55% at 100% 12%,
          rgba(255, 137, 24, 0.70) 0%,
          rgba(185, 65, 8, 0.30) 42%,
          transparent 78%
        ),
        /* Warm orange glow down the right side */
        radial-gradient(
          ellipse 70% 68% at 100% 72%,
          rgba(237, 83, 8, 0.60) 0%,
          rgba(147, 43, 7, 0.28) 43%,
          transparent 78%
        ),
        /* Deep orange glow at the lower-left */
        radial-gradient(
          ellipse 85% 60% at 0% 100%,
          rgba(255, 105, 10, 0.78) 0%,
          rgba(194, 54, 6, 0.36) 42%,
          transparent 78%
        ),
        /* Subtle central warmth */
        radial-gradient(
          ellipse 65% 70% at 50% 48%,
          rgba(65, 28, 10, 0.38) 0%,
          transparent 80%
        ),
        /* Almost-black base */
        linear-gradient(
          145deg,
          #21100a 0%,
          #100b09 42%,
          #080706 72%,
          #160b07 100%
        );
    }
  </style>
</head>
<body>
  <div class="halloween-background"></div>
</body>
</html>
