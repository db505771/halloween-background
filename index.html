
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Black & Orange Flowing Smoke</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050403;
}

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background: #080503;
}

/* Base orange atmosphere */
.orange-base {
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(ellipse at 5% 30%, #ff6500 0%, transparent 38%),
    radial-gradient(ellipse at 95% 70%, #f04a00 0%, transparent 42%),
    radial-gradient(ellipse at 35% 100%, #a92d00 0%, transparent 40%),
    radial-gradient(ellipse at 75% 0%, #bd3900 0%, transparent 38%);
  filter: blur(35px);
  animation: orangeTravel 5s ease-in-out infinite alternate;
}

/* Moving black streams — stretched rather than circular */
.stream {
  position: absolute;
  z-index: 2;
  left: -35%;
  width: 170%;
  height: 34%;
  border-radius: 50%;
  filter: blur(35px);
  background: #050403;
  will-change: transform;
}

.stream-one {
  top: 10%;
  transform: rotate(-13deg);
  animation: streamOne 4.5s ease-in-out infinite alternate;
}

.stream-two {
  top: 38%;
  height: 27%;
  transform: rotate(9deg);
  animation: streamTwo 3.8s ease-in-out infinite alternate;
}

.stream-three {
  top: 65%;
  height: 35%;
  transform: rotate(-10deg);
  animation: streamThree 5.2s ease-in-out infinite alternate;
}

/* Orange ribbons flowing through the dark streams */
.ribbon {
  position: absolute;
  z-index: 3;
  width: 155%;
  height: 18%;
  left: -25%;
  border-radius: 50%;
  filter: blur(32px);
  opacity: 0.95;
  background: #ff5b00;
  will-change: transform;
}

.ribbon-one {
  top: 23%;
  animation: ribbonOne 3.2s ease-in-out infinite alternate;
}

.ribbon-two {
  top: 53%;
  height: 15%;
  background: #d83a00;
  animation: ribbonTwo 3.7s ease-in-out infinite alternate;
}

.ribbon-three {
  top: 77%;
  height: 13%;
  background: #ff7914;
  animation: ribbonThree 4.1s ease-in-out infinite alternate;
}

/* Soft color haze so no edges look cut out */
.color-haze {
  position: absolute;
  z-index: 4;
  inset: -20%;
  background:
    linear-gradient(
      120deg,
      transparent 10%,
      rgba(255, 78, 0, 0.18) 27%,
      rgba(0, 0, 0, 0.10) 39%,
      rgba(255, 90, 0, 0.16) 52%,
      rgba(0, 0, 0, 0.12) 66%,
      transparent 85%
    );
  filter: blur(45px);
  animation: hazeMove 4s ease-in-out infinite alternate;
}

/* Color streams travel sideways and diagonally */
@keyframes orangeTravel {
  0% {
    transform: translate(-5%, 3%) rotate(-3deg);
  }
  100% {
    transform: translate(5%, -3%) rotate(3deg);
  }
}

@keyframes streamOne {
  0% {
    transform: translate(-8%, -12%) rotate(-17deg);
  }
  100% {
    transform: translate(10%, 15%) rotate(-5deg);
  }
}

@keyframes streamTwo {
  0% {
    transform: translate(9%, 8%) rotate(15deg);
  }
  100% {
    transform: translate(-9%, -10%) rotate(2deg);
  }
}

@keyframes streamThree {
  0% {
    transform: translate(-7%, 12%) rotate(-15deg);
  }
  100% {
    transform: translate(8%, -12%) rotate(-3deg);
  }
}

@keyframes ribbonOne {
  0% {
    transform: translate(-12%, 8%) rotate(10deg);
  }
  100% {
    transform: translate(12%, -10%) rotate(-8deg);
  }
}

@keyframes ribbonTwo {
  0% {
    transform: translate(10%, -8%) rotate(-10deg);
  }
  100% {
    transform: translate(-10%, 10%) rotate(12deg);
  }
}

@keyframes ribbonThree {
  0% {
    transform: translate(-10%, -6%) rotate(8deg);
  }
  100% {
    transform: translate(10%, 8%) rotate(-12deg);
  }
}

@keyframes hazeMove {
  0% {
    transform: translate(-4%, 2%) rotate(-3deg);
  }
  100% {
    transform: translate(4%, -2%) rotate(3deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .orange-base,
  .stream,
  .ribbon,
  .color-haze {
    animation: none;
  }
}
</style>
</head>

<body>
<div class="background">
  <div class="orange-base"></div>

  <div class="stream stream-one"></div>
  <div class="stream stream-two"></div>
  <div class="stream stream-three"></div>

  <div class="ribbon ribbon-one"></div>
  <div class="ribbon ribbon-two"></div>
  <div class="ribbon ribbon-three"></div>

  <div class="color-haze"></div>
</div>
</body>
</html>
