
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Blended Halloween Smoke</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050403;
}

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background: #050403;
}

/* Orange glow clouds */
.cloud {
  position: absolute;
  width: 80vw;
  height: 120vh;
  top: -10vh;
  border-radius: 50%;
  filter: blur(65px);
  opacity: 0.9;
  will-change: transform;
}

.orange-left {
  left: -35vw;
  background: #ff5a00;
  animation: orangeLeft 3s ease-in-out infinite alternate;
}

.orange-right {
  right: -35vw;
  background: #ff6500;
  animation: orangeRight 3.4s ease-in-out infinite alternate;
}

.orange-center-left {
  left: -25vw;
  top: 15vh;
  width: 85vw;
  height: 75vh;
  background: #a92c00;
  filter: blur(90px);
  opacity: 0.75;
  animation: centerLeft 2.6s ease-in-out infinite alternate;
}

.orange-center-right {
  right: -25vw;
  top: 10vh;
  width: 85vw;
  height: 80vh;
  background: #c23b00;
  filter: blur(90px);
  opacity: 0.75;
  animation: centerRight 3.2s ease-in-out infinite alternate;
}

/* Dark clouds that MIX with the orange */
.black-smoke {
  position: absolute;
  width: 85vw;
  height: 115vh;
  top: -8vh;
  border-radius: 45%;
  background: #080604;
  filter: blur(75px);
  opacity: 0.92;
  will-change: transform;
}

.black-left {
  left: 8vw;
  animation: blackLeft 3.1s ease-in-out infinite alternate;
}

.black-right {
  right: 8vw;
  animation: blackRight 2.8s ease-in-out infinite alternate;
}

.black-middle {
  position: absolute;
  z-index: 2;
  left: 20%;
  top: -20%;
  width: 60%;
  height: 140%;
  background: #050403;
  filter: blur(48px);
  opacity: 0.85;
  animation: middleFlow 3.5s ease-in-out infinite alternate;
}

/* Extra soft blending layer */
.blend {
  position: absolute;
  inset: -25%;
  z-index: 3;
  background:
    linear-gradient(
      90deg,
      rgba(5,4,3,0.0) 0%,
      rgba(5,4,3,0.15) 18%,
      rgba(5,4,3,0.4) 32%,
      rgba(5,4,3,0.25) 43%,
      rgba(5,4,3,0.45) 55%,
      rgba(5,4,3,0.2) 68%,
      rgba(5,4,3,0.0) 85%
    );
  filter: blur(60px);
  animation: blendFlow 4s ease-in-out infinite alternate;
}

/* Quick, overlapping motion */
@keyframes orangeLeft {
  0% { transform: translate(-8vw, -5vh) scale(0.9) rotate(-8deg); }
  100% { transform: translate(28vw, 10vh) scale(1.2) rotate(10deg); }
}

@keyframes orangeRight {
  0% { transform: translate(8vw, 6vh) scale(1.1) rotate(8deg); }
  100% { transform: translate(-28vw, -12vh) scale(0.9) rotate(-10deg); }
}

@keyframes centerLeft {
  0% { transform: translate(-8vw, 10vh) scale(0.85); }
  100% { transform: translate(25vw, -10vh) scale(1.2); }
}

@keyframes centerRight {
  0% { transform: translate(8vw, -10vh) scale(1.15); }
  100% { transform: translate(-25vw, 12vh) scale(0.85); }
}

@keyframes blackLeft {
  0% { transform: translate(8vw, 4vh) scale(0.8); }
  100% { transform: translate(-15vw, -5vh) scale(1.15); }
}

@keyframes blackRight {
  0% { transform: translate(-8vw, -5vh) scale(1.15); }
  100% { transform: translate(15vw, 6vh) scale(0.8); }
}

@keyframes middleFlow {
  0% { transform: translateX(-5vw) scaleX(0.85); }
  100% { transform: translateX(5vw) scaleX(1.15); }
}

@keyframes blendFlow {
  0% { transform: translateX(-5vw) translateY(2vh); }
  100% { transform: translateX(5vw) translateY(-2vh); }
}

@media (prefers-reduced-motion: reduce) {
  .cloud, .black-smoke, .black-middle, .blend {
    animation: none;
  }
}
</style>
</head>

<body>
<div class="background">
  <div class="cloud orange-left"></div>
  <div class="cloud orange-right"></div>
  <div class="cloud orange-center-left"></div>
  <div class="cloud orange-center-right"></div>

  <div class="black-smoke black-left"></div>
  <div class="black-smoke black-right"></div>
  <div class="black-middle"></div>

  <div class="blend"></div>
</div>
</body>
</html>
