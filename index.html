
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Moving Halloween Smoke</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080605;
}

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #080605;
  isolation: isolate;
}

/* Medium warm orange, spread across the background */
.orange-base {
  position: absolute;
  inset: -35%;
  background:
    radial-gradient(ellipse at 15% 25%,
      #c95718 0%, transparent 43%),
    radial-gradient(ellipse at 80% 70%,
      #bd4812 0%, transparent 45%),
    radial-gradient(ellipse at 50% 5%,
      #8d3511 0%, transparent 42%),
    radial-gradient(ellipse at 35% 95%,
      #a94113 0%, transparent 45%);
  filter: blur(48px);
  animation: baseMove 5s ease-in-out infinite alternate;
  will-change: transform;
}

/* Soft orange clouds that visibly drift */
.orange-cloud {
  position: absolute;
  width: 75vw;
  height: 85vh;
  border-radius: 50%;
  filter: blur(65px);
  opacity: 0.8;
  will-change: transform;
}

.orange-one {
  top: -25%;
  left: -25%;
  background: #d96620;
  animation: orangeOne 3.4s ease-in-out infinite alternate;
}

.orange-two {
  bottom: -30%;
  right: -25%;
  background: #c05217;
  animation: orangeTwo 4.1s ease-in-out infinite alternate;
}

.orange-three {
  top: 20%;
  left: 25%;
  width: 65vw;
  height: 65vh;
  background: #9d3b12;
  opacity: 0.7;
  animation: orangeThree 3.8s ease-in-out infinite alternate;
}

/* Black smoke flows through the orange */
.black-cloud {
  position: absolute;
  width: 100vw;
  height: 65vh;
  border-radius: 50%;
  background: #050403;
  filter: blur(65px);
  opacity: 0.88;
  will-change: transform;
}

.black-one {
  top: -28%;
  left: -20%;
  animation: blackOne 3.8s ease-in-out infinite alternate;
}

.black-two {
  top: 30%;
  left: 20%;
  height: 55vh;
  animation: blackTwo 3.2s ease-in-out infinite alternate;
}

.black-three {
  bottom: -35%;
  left: -15%;
  animation: blackThree 4.3s ease-in-out infinite alternate;
}

/* Softly blend the colors where they overlap */
.blend {
  position: absolute;
  inset: -25%;
  background:
    radial-gradient(ellipse at 35% 35%,
      rgba(180, 67, 18, 0.20), transparent 48%),
    radial-gradient(ellipse at 68% 65%,
      rgba(150, 49, 12, 0.20), transparent 48%);
  filter: blur(50px);
  animation: blendMove 4s ease-in-out infinite alternate;
  pointer-events: none;
}

/* Large position changes make movement visible */
@keyframes baseMove {
  0% {
    transform: translate(-7%, 4%) rotate(-4deg);
  }
  100% {
    transform: translate(7%, -4%) rotate(4deg);
  }
}

@keyframes orangeOne {
  0% {
    transform: translate(-12vw, -8vh) scale(0.9);
  }
  100% {
    transform: translate(30vw, 22vh) scale(1.2);
  }
}

@keyframes orangeTwo {
  0% {
    transform: translate(15vw, 10vh) scale(1.15);
  }
  100% {
    transform: translate(-30vw, -20vh) scale(0.9);
  }
}

@keyframes orangeThree {
  0% {
    transform: translate(15vw, -15vh) scale(0.85);
  }
  100% {
    transform: translate(-25vw, 20vh) scale(1.15);
  }
}

@keyframes blackOne {
  0% {
    transform: translate(-15vw, -10vh) rotate(-12deg);
  }
  100% {
    transform: translate(25vw, 15vh) rotate(8deg);
  }
}

@keyframes blackTwo {
  0% {
    transform: translate(20vw, 12vh) rotate(12deg);
  }
  100% {
    transform: translate(-25vw, -15vh) rotate(-10deg);
  }
}

@keyframes blackThree {
  0% {
    transform: translate(-20vw, 10vh) rotate(-8deg);
  }
  100% {
    transform: translate(20vw, -12vh) rotate(10deg);
  }
}

@keyframes blendMove {
  0% {
    transform: translate(-7%, 3%) rotate(-3deg);
  }
  100% {
    transform: translate(7%, -3%) rotate(3deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .orange-base,
  .orange-cloud,
  .black-cloud,
  .blend {
    animation: none;
  }
}
</style>
</head>

<body>
<div class="background">
  <div class="orange-base"></div>

  <div class="orange-cloud orange-one"></div>
  <div class="orange-cloud orange-two"></div>
  <div class="orange-cloud orange-three"></div>

  <div class="black-cloud black-one"></div>
  <div class="black-cloud black-two"></div>
  <div class="black-cloud black-three"></div>

  <div class="blend"></div>
</div>
</body>
</html>
