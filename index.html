
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fast Moving Orange Smoke</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050403;
}

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #050403;
  isolation: isolate;
}

/* Orange clouds */
.cloud {
  position: absolute;
  width: 75vw;
  height: 115vh;
  top: -7vh;
  border-radius: 50%;
  filter: blur(75px);
  will-change: transform;
  opacity: 0.95;
}

.cloud-left {
  left: -32vw;
  background: #ff5900;
  animation: moveLeft 2.2s ease-in-out infinite alternate;
}

.cloud-left-inner {
  left: -48vw;
  top: 12vh;
  width: 85vw;
  height: 85vh;
  background: #b83200;
  filter: blur(90px);
  opacity: 0.85;
  animation: moveLeftInner 2.8s ease-in-out infinite alternate;
}

.cloud-right {
  right: -32vw;
  background: #ff6900;
  animation: moveRight 2.5s ease-in-out infinite alternate;
}

.cloud-right-inner {
  right: -48vw;
  top: 18vh;
  width: 85vw;
  height: 85vh;
  background: #a92c00;
  filter: blur(90px);
  opacity: 0.85;
  animation: moveRightInner 3s ease-in-out infinite alternate;
}

/* Dark center with soft blended edges */
.center-darkness {
  position: absolute;
  z-index: 2;
  inset: -20%;
  background: linear-gradient(
    90deg,
    rgba(5,4,3,0.00) 0%,
    rgba(5,4,3,0.12) 15%,
    rgba(5,4,3,0.55) 28%,
    rgba(5,4,3,0.88) 39%,
    rgba(5,4,3,0.94) 50%,
    rgba(5,4,3,0.88) 61%,
    rgba(5,4,3,0.55) 72%,
    rgba(5,4,3,0.12) 85%,
    rgba(5,4,3,0.00) 100%
  );
  filter: blur(35px);
  animation: shiftDark 2.5s ease-in-out infinite alternate;
  pointer-events: none;
}

/* Soft smoky layer */
.blend-smoke {
  position: absolute;
  z-index: 3;
  inset: -35%;
  background: linear-gradient(
    100deg,
    transparent 20%,
    rgba(5,4,3,0.20) 32%,
    rgba(5,4,3,0.50) 45%,
    rgba(5,4,3,0.55) 55%,
    rgba(5,4,3,0.20) 68%,
    transparent 80%
  );
  filter: blur(55px);
  animation: smokeDrift 2.8s ease-in-out infinite alternate;
  pointer-events: none;
}

/* Faster, more visible movement */
@keyframes moveLeft {
  0% {
    transform: translate(-12vw, -8vh) scale(0.9);
  }
  100% {
    transform: translate(35vw, 18vh) scale(1.3);
  }
}

@keyframes moveLeftInner {
  0% {
    transform: translate(-8vw, 12vh) scale(0.85);
  }
  100% {
    transform: translate(32vw, -18vh) scale(1.25);
  }
}

@keyframes moveRight {
  0% {
    transform: translate(12vw, 8vh) scale(0.9);
  }
  100% {
    transform: translate(-35vw, -18vh) scale(1.3);
  }
}

@keyframes moveRightInner {
  0% {
    transform: translate(8vw, -12vh) scale(0.85);
  }
  100% {
    transform: translate(-32vw, 18vh) scale(1.25);
  }
}

@keyframes shiftDark {
  0% {
    transform: translateX(-6vw);
  }
  100% {
    transform: translateX(6vw);
  }
}

@keyframes smokeDrift {
  0% {
    transform: translate(-8vw, 4vh) scale(0.9);
  }
  100% {
    transform: translate(8vw, -4vh) scale(1.1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .cloud,
  .center-darkness,
  .blend-smoke {
    animation: none;
  }
}
</style>
</head>

<body>
<div class="background">
  <div class="cloud cloud-left"></div>
  <div class="cloud cloud-left-inner"></div>
  <div class="cloud cloud-right"></div>
  <div class="cloud cloud-right-inner"></div>
  <div class="center-darkness"></div>
  <div class="blend-smoke"></div>
</div>
</body>
</html>
